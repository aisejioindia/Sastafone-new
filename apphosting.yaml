# Firebase App Hosting configuration (Node.js / Express + Vite SPA)
# Docs: https://firebase.google.com/docs/app-hosting/configure
runConfig:
  cpu: 1
  memoryMiB: 512
  concurrency: 80
  minInstances: 0
  maxInstances: 4

env:
  - variable: NODE_ENV
    value: production
    availability:
      - RUNTIME
  - variable: APP_URL
    value: https://sastafone.in
    availability:
      - BUILD
      - RUNTIME
